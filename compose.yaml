services:
  web:
    build: .
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      DATABASE_PATH: /app/data/guild-queue.sqlite
    volumes:
      - queue-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  queue-data:
